<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Pulse · 实时监控</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<div class="shell"><header><a class="brand" href="/" aria-label="Codex Pulse"><span class="brandmark">∿</span> Codex Pulse <span class="tag">LOCAL</span></a><span id="connection" class="connection">正在连接</span></header>
<main><div class="intro"><div><div class="eyebrow">YOUR WORKSPACE, AT A GLANCE</div><h1>专注创作，状态一目了然。</h1><p>随时掌握 Codex 使用额度与连接质量。</p></div><div class="actions"><button id="notify">开启提醒</button><button id="refresh" class="primary">↻ 刷新状态</button></div></div>
<div class="meta"><span id="account">正在读取账号…</span><span id="updated">等待首次采集</span></div><div id="notice" role="status" aria-live="polite"></div>
<section aria-label="使用额度"><div class="section-heading"><h2>可用额度</h2><span>账号共享 · 自动刷新</span></div><div id="quotas" class="quota-grid"><article class="card placeholder">正在读取额度…</article></div></section>
<div class="bottom-grid"><section class="card network"><div class="section-heading"><h2>连接质量</h2><span class="pill" id="network-badge">检测中</span></div><div class="network-main"><strong id="latency">—</strong><span>ms / HTTPS 请求耗时</span></div><div id="network-detail" class="detail-list"></div><p class="footnote" id="network-note">正在检测服务连通性。</p><div id="spark" class="spark" aria-label="最近探测延迟"></div></section>
<section class="card"><div class="section-heading"><h2>Token 用量</h2><span class="pill">已消耗</span></div><div class="token-grid"><div><span>最近统计日</span><strong id="daily">—</strong><small id="daily-date">等待数据</small></div><div><span>累计使用</span><strong id="lifetime">—</strong><small>账号统计</small></div></div><p class="footnote" id="usage-note">统计存在延迟，已用 Token 不等于剩余额度。</p></section></div>
<footer><span class="dot"></span> 本机运行 · 监控不发起模型推理请求 <span class="footer-right">CODEX PULSE / 0.1</span></footer></main></div></body></html>
